name: transcript-bot

services:
  transcript-bot:
    build: .
    container_name: transcript-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./hf_cache:/app/hf_cache
      - ./welcome.md:/app/welcome.md
    mem_limit: 1200m
    memswap_limit: 1200m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
